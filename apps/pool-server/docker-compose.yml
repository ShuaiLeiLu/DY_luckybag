services:
  pool-server:
    image: ${POOL_IMAGE:-dy-pool-server:latest}
    container_name: dy-pool-server
    restart: unless-stopped
    ports:
      - "${POOL_PORT:-9090}:9090"
    environment:
      POOL_CONFIG_FILE: /app/config.json
      POOL_REDIS_ENABLED: "true"
      # Redis 地址可在 config.json 中配置，或在此通过环境变量覆盖：
      # REDIS_ADDR: "redis:6379"
      # REDIS_PASSWORD: ""
      # REDIS_DB: "0"
    volumes:
      - ../../config.json:/app/config.json:ro
