services:
  redis:
    image: redis:7-alpine
    container_name: dy-pool-redis-local
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  pool-server:
    image: ${POOL_IMAGE:-dy-pool-server:latest}
    container_name: dy-pool-server-local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${POOL_PORT:-9090}:9090"
    environment:
      POOL_CONFIG_FILE: /app/config.json
      POOL_REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
    volumes:
      - ../../config.example.json:/app/config.json:ro
