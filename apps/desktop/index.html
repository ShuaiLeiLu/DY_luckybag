<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta name="dy-execution-runtime" content="native-protocol-runtime-v1" />
    <meta name="dy-login-runtime" content="native-qr-login-v1" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抖娃福袋工作台</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at top left, rgba(43, 169, 200, 0.22), transparent 34%),
          radial-gradient(circle at top right, rgba(36, 201, 167, 0.16), transparent 28%),
          linear-gradient(160deg, #05111f, #0d1b2a 48%, #091625 100%);
        color: #ecf4ff;
        font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #boot-fallback {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      #boot-fallback-panel {
        width: min(720px, 100%);
        padding: 28px;
        border-radius: 28px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: linear-gradient(180deg, rgba(15, 29, 46, 0.92), rgba(8, 18, 30, 0.78));
        box-shadow: 0 18px 60px rgba(3, 10, 18, 0.42);
      }

      #boot-fallback-title {
        margin: 0 0 12px;
        font-size: 24px;
      }

      #boot-fallback-message {
        margin: 0;
        line-height: 1.7;
        color: #b8c6db;
      }

      #boot-fallback-detail {
        display: none;
        margin-top: 18px;
        white-space: pre-wrap;
        word-break: break-word;
        padding: 16px;
        border-radius: 18px;
        background: rgba(2, 6, 23, 0.45);
        color: #dbeafe;
        font-size: 13px;
        line-height: 1.6;
      }
    </style>
    <script>
      window.__desktopBootFallback = function (title, message, detail) {
        var titleEl = document.getElementById('boot-fallback-title')
        var messageEl = document.getElementById('boot-fallback-message')
        var detailEl = document.getElementById('boot-fallback-detail')
        if (titleEl) titleEl.textContent = title || '桌面端启动中'
        if (messageEl) messageEl.textContent = message || '正在加载页面资源，请稍候。'
        if (detailEl) {
          var safeDetail = String(detail || '').trim()
          detailEl.textContent = safeDetail
          detailEl.style.display = safeDetail ? 'block' : 'none'
        }
      }

      window.addEventListener('error', function (event) {
        var detail = event && event.error
          ? (event.error.stack || event.error.message || String(event.error))
          : (event && event.message) || 'unknown error'
        window.__desktopBootFallback('桌面端启动失败', '渲染层初始化时报错。', detail)
      })

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason
        var detail = reason && reason.stack
          ? reason.stack
          : (reason && reason.message) || String(reason || 'unknown rejection')
        window.__desktopBootFallback('桌面端启动失败', '启动阶段出现未处理的异步异常。', detail)
      })
    </script>
  </head>
  <body>
    <div id="app">
      <div id="boot-fallback">
        <div id="boot-fallback-panel">
          <h1 id="boot-fallback-title">桌面端启动中</h1>
          <p id="boot-fallback-message">正在加载页面资源，请稍候。</p>
          <pre id="boot-fallback-detail"></pre>
        </div>
      </div>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
