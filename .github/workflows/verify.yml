name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/pool-server/go.sum
      - run: npm ci
      - run: npm run desktop:test
      - run: npm run protocol:verify-native-core
      - run: npm run desktop:build
      - run: go test -race ./...
        working-directory: apps/pool-server
      - run: xvfb-run -a npm run test:offline
