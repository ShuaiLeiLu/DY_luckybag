<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>授权管理后台</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f7fb; color: #1f2937; }
    .wrap { max-width: 1180px; margin: 18px auto; padding: 0 14px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.04); margin-bottom: 14px; }
    .hd { padding: 12px 14px; border-bottom: 1px solid #eef2f7; font-weight: 700; }
    .bd { padding: 14px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    input, select, button, textarea {
      height: 34px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 10px; font-size: 14px;
    }
    textarea { height: 64px; padding: 8px 10px; resize: vertical; min-width: 280px; }
    input, select, textarea { background: #fff; }
    .w120 { width: 120px; } .w160 { width: 160px; } .w220 { width: 220px; } .w320 { width: 320px; }
    button { cursor: pointer; background: #10b981; color: #fff; border-color: #10b981; }
    button.secondary { background: #fff; color: #374151; border-color: #cbd5e1; }
    button.warn { background: #f59e0b; border-color: #f59e0b; }
    button.danger { background: #ef4444; border-color: #ef4444; }
    .msg { padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; display: none; }
    .msg.ok { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; display: block; }
    .msg.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #eef2f7; text-align: left; padding: 10px 8px; vertical-align: top; }
    th { color: #475569; font-weight: 700; background: #f8fafc; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .status.active { background: #dcfce7; color: #166534; }
    .status.disabled { background: #fee2e2; color: #991b1b; }
    .actions button { margin-right: 6px; margin-bottom: 6px; height: 28px; font-size: 12px; padding: 0 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="hd">授权管理后台（简版）</div>
      <div class="bd">
        <div id="msg" class="msg"></div>
        <div class="row">
          <input id="token" class="w320" placeholder="请输入后台管理 Token（POOL_LICENSE_ADMIN_TOKEN）" />
          <button class="secondary" onclick="saveToken()">保存Token</button>
          <button onclick="loadLicenses()">刷新列表</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="hd">新增授权</div>
      <div class="bd">
        <div class="row">
          <input id="create_days" class="w120" type="number" min="1" max="3650" value="30" placeholder="授权天数" />
          <input id="create_quantity" class="w120" type="number" min="1" max="500" value="1" placeholder="授权码数量" />
          <button onclick="createLicense()">创建授权</button>
        </div>
        <div class="row">
          <textarea id="created_keys" style="width:100%; min-height:88px;" readonly placeholder="创建成功后，这里会显示授权码（每行一个）"></textarea>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="hd">授权列表</div>
      <div class="bd">
        <table>
          <thead>
          <tr>
            <th>ID</th>
            <th>授权码</th>
            <th>状态</th>
            <th>到期</th>
            <th>绑定客户端</th>
            <th>最近活跃</th>
            <th>操作</th>
          </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const msgEl = $("msg");
    const tbody = $("tbody");
    const state = { page: 1, pageSize: 50, total: 0 };

    function showMsg(text, ok = true) {
      msgEl.className = "msg " + (ok ? "ok" : "err");
      msgEl.textContent = text || "";
    }

    function getToken() {
      return ($("token").value || "").trim();
    }

    function saveToken() {
      localStorage.setItem("DY_LICENSE_ADMIN_TOKEN", getToken());
      showMsg("Token 已保存");
    }

    function loadToken() {
      $("token").value = localStorage.getItem("DY_LICENSE_ADMIN_TOKEN") || "";
    }

    function fmtTime(ms) {
      if (!ms || Number(ms) <= 0) return "-";
      const d = new Date(Number(ms));
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${y}-${m}-${day} ${hh}:${mm}`;
    }

    async function request(path, method = "GET", body = null) {
      const token = getToken();
      const res = await fetch(path, {
        method,
        headers: {
          "content-type": "application/json",
          "x-admin-token": token
        },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok !== true) {
        throw new Error(data.error || `http_${res.status}`);
      }
      return data;
    }

    async function createLicense() {
      try {
        const days = Number($("create_days").value || 30);
        const quantity = Number($("create_quantity").value || 1);
        const data = await request("/admin/api/licenses/create", "POST", {
          days,
          quantity
        });
        const result = data.result || {};
        const keys = Array.isArray(result.keys) ? result.keys : [];
        $("created_keys").value = keys.join("\n");
        showMsg(`创建成功：共 ${Number(result.count || keys.length || 0)} 个授权码`);
        await loadLicenses();
      } catch (err) {
        showMsg(`创建失败：${err.message}`, false);
      }
    }

    async function setStatus(id, status) {
      try {
        await request("/admin/api/licenses/status", "POST", { id, status });
        showMsg(`状态已更新为 ${status}`);
        await loadLicenses();
      } catch (err) {
        showMsg(`状态更新失败：${err.message}`, false);
      }
    }

    async function extendLicense(id, days = 30) {
      try {
        await request("/admin/api/licenses/extend", "POST", { id, days });
        showMsg(`续期成功：+${days} 天`);
        await loadLicenses();
      } catch (err) {
        showMsg(`续期失败：${err.message}`, false);
      }
    }

    async function unbindLicense(id) {
      try {
        await request("/admin/api/licenses/unbind", "POST", { id });
        showMsg("解绑成功");
        await loadLicenses();
      } catch (err) {
        showMsg(`解绑失败：${err.message}`, false);
      }
    }

    function renderRows(items = []) {
      tbody.innerHTML = items.map(item => {
        const status = String(item.status || "");
        const statusClass = status === "active" ? "active" : "disabled";
        return `
          <tr>
            <td>${item.id}</td>
            <td class="mono">${item.licenseKey || ""}</td>
            <td><span class="status ${statusClass}">${status || "-"}</span></td>
            <td>${fmtTime(item.expireAt)}</td>
            <td class="mono">${item.bindClientId || "-"}</td>
            <td>${fmtTime(item.lastSeenAt)}</td>
            <td class="actions">
              <button class="secondary" onclick="extendLicense(${item.id}, 30)">续期30天</button>
              <button class="secondary" onclick="unbindLicense(${item.id})">解绑</button>
              ${status === "active"
                ? `<button class="danger" onclick="setStatus(${item.id}, 'disabled')">停用</button>`
                : `<button class="warn" onclick="setStatus(${item.id}, 'active')">启用</button>`}
            </td>
          </tr>
        `;
      }).join("");
    }

    async function loadLicenses() {
      try {
        const data = await request(`/admin/api/licenses?page=${state.page}&pageSize=${state.pageSize}`);
        const result = data.result || { total: 0, items: [] };
        state.total = Number(result.total || 0);
        renderRows(Array.isArray(result.items) ? result.items : []);
        showMsg(`加载成功，共 ${state.total} 条`);
      } catch (err) {
        showMsg(`加载失败：${err.message}`, false);
      }
    }

    loadToken();
    loadLicenses();
  </script>
</body>
</html>
